<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="28" fill="url(#bgGrad)" stroke="#a855f7" stroke-width="3" stroke-opacity="0.6"/>
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="1" fill="url(#purpleGrad)" filter="url(#glow)">AVK</text>
